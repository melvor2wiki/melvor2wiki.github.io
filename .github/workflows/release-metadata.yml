name: Prepare public release metadata
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  public-metadata:
    if: github.event.head_commit.message == 'Prepare static release with private metadata excluded'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify static release
        run: python3 build.py
      - name: Publish clean release history
        env:
          RELEASE_PARENT: ${{ github.sha }}
        run: |
          git checkout --orphan public-release
          git add .
          git -c user.name='seriafrancesco' -c user.email='225983313+seriafrancesco@users.noreply.github.com' commit -m 'Publish verified static wiki release'
          git push origin HEAD:main --force-with-lease=refs/heads/main:$RELEASE_PARENT
